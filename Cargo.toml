[package]
name = "tenrec"
version = "0.1.0"
edition = "2021"
description = "A desktop-style host for Claude Code: a Rust core that runs `claude` headless and serves a custom chat UI"
license = "MIT"
default-run = "tenrec"

[lib]
name = "tenrec"
path = "src/lib.rs"

[[bin]]
name = "tenrec"
path = "src/bin/main.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"

# The native desktop app (Slint). Built with `--features desktop`; the library and its tests do not need Slint.
[[bin]]
name = "tenrec-desktop"
path = "src/bin/desktop/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:slint", "dep:slint-build", "dep:arboard", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
fancy-regex = "0.20"
futures-util = "0.3"
getrandom = "0.2"
libc = "0.2"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
sys-locale = "0.3.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "raw-window-handle-06"], optional = true }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"], optional = true }
# Thumbnails of attached images and the PNG of a pasted one; the same pure-Rust crate Slint already uses.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# The native folder picker: COM IFileOpenDialog on Windows, the desktop portal on Linux (no GTK).
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"], optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false }

# SQLite is C compiled by cc-rs: without this a debug build is unoptimised and the index tests crawl.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# The guard's patterns run on every tool call and its tests feed them 5000-character inputs: unoptimised, a debug build is ten times slower.
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
